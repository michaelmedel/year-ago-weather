<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Weather a Year Ago Today</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

<style>
body {
  background: #f5f7fa;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}

main.container {
  max-width: 520px;
  margin: auto;
  padding-bottom: env(safe-area-inset-bottom);
}

article {
  margin: 0;
  padding: clamp(16px, 5vw, 24px);
}

h1 {
  text-align: center;
  margin-bottom: 0;
}

.page-header {
  position: relative;
}

.page-header .reset-button {
  position: absolute;
  top: 0;
  right: 0;
}

.subtitle {
  text-align: center;
  margin: 0 0 18px;
}

.dropdown {
  background: var(--pico-card-background-color);
  border: var(--pico-border-width) solid var(--pico-muted-border-color);
  border-radius: var(--pico-border-radius);
  max-height: 200px;
  overflow-y: auto;
  margin: -12px 0 16px;
}

.dropdown div {
  min-height: 44px;
  padding: 12px 16px;
  cursor: pointer;
}

.dropdown div:hover {
  background: var(--pico-secondary-background);
}

.reset-button {
  display: block;
  width: auto;
  margin: 0;
  padding: 6px 10px;
  font-size: 0.8rem;
}

.weather-box {
  background: var(--pico-secondary-background);
  padding: 16px;
  border-radius: var(--pico-border-radius);
  margin-top: 12px;
  line-height: 1.5;
}

.location-context {
  margin: 14px 0 10px;
  color: var(--pico-muted-color);
  font-weight: 700;
}

.weather-box strong {
  display: block;
  margin-bottom: 6px;
}

.summary {
  margin-top: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: clamp(150px, 24vh, 230px);
  padding: 24px 20px;
  background: #e6f4ea;
  border-radius: var(--pico-border-radius);
  color: #14532d;
  line-height: 1.35;
  font-weight: 700;
  text-align: center;
}

.summary.is-hidden {
  display: none;
}

.summary.is-loading {
  justify-content: center;
}

.ai-spinner {
  width: 34px;
  height: 34px;
  border: 4px solid rgba(20, 83, 45, 0.2);
  border-top-color: #15803d;
  border-radius: 50%;
  animation: ai-spin 0.8s linear infinite;
}

.ai-icon {
  display: block;
  margin-bottom: 10px;
  font-size: 42px;
  line-height: 1;
}

@keyframes ai-spin {
  to { transform: rotate(360deg); }
}

.icon {
  display: inline-block;
  margin: 2px 0 6px;
  font-size: 30px;
  line-height: 1;
  filter: drop-shadow(0 3px 3px rgba(15, 23, 42, 0.12));
}

.weather-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.weather-grid > div {
  min-width: 0;
}

.weather-grid .weather-box {
  min-height: 116px;
  margin-top: 0;
}

#today,
#lastYear {
  min-width: 0;
}

@media (max-width: 639px) {
  article {
    padding: 16px;
  }

  .summary {
    line-height: 1.4;
  }


  .summary {
    min-height: 180px;
    padding: 24px 18px;
  }

  .weather-grid .icon {
    font-size: 36px;
    animation: weather-bob 2.8s ease-in-out infinite;
  }
}

@media (max-width: 420px) {
  body {
    padding-right: max(8px, env(safe-area-inset-right));
    padding-left: max(8px, env(safe-area-inset-left));
  }

  .weather-grid {
    grid-template-columns: 1fr;
  }

  .weather-grid .weather-box {
    min-height: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}

@keyframes weather-bob {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-3px) rotate(2deg); }
}

@media (min-width: 640px) {
  body {
    padding: 40px 16px;
  }
}
</style>
</head>

<body>

<main class="container">
<article>

<header class="page-header">
  <h1>Whether App</h1>
  <button class="secondary outline reset-button" type="button" onclick="resetForm()" title="Clear the search and results">Clear</button>
  <p class="subtitle">
  Compare today's weather with last year's 🤷
  </p>
</header>

<input id="search" type="search" aria-label="Search city" placeholder="Search city..." oninput="searchCity()">
<div id="results" class="dropdown"></div>

<button type="button" onclick="render()">Check the Weather</button>

<div class="location-context" id="locationContext"></div>
<div class="weather-grid">
  <div id="today"></div>
  <div id="lastYear"></div>
</div>
<div class="summary is-hidden" id="summary">Your AI weather verdict will appear here.</div>

</article>
</main>

<script>
let selectedLocation = null;

function cToF(c){ return Math.round((c * 9/5) + 32); }

function resetForm(){
  selectedLocation = null;
  document.getElementById("search").value = "";
  document.getElementById("results").innerHTML = "";
  document.getElementById("locationContext").innerText = "";
  document.getElementById("today").innerHTML = "";
  document.getElementById("lastYear").innerHTML = "";
  const summary = document.getElementById("summary");
  summary.classList.remove("is-loading");
  summary.classList.add("is-hidden");
  summary.innerHTML = "Your AI weather verdict will appear here.";
}

function getWeather(code){
  const map = {
    0:{text:"clear skies", icon:"☀️"},
    1:{text:"mostly clear", icon:"🌤"},
    2:{text:"partly cloudy", icon:"⛅"},
    3:{text:"overcast", icon:"☁️"},
    45:{text:"foggy", icon:"🌫"},
    61:{text:"light rain", icon:"🌦"},
    63:{text:"rain", icon:"🌧"},
    65:{text:"heavy rain", icon:"🌧"},
    71:{text:"snow", icon:"❄️"},
    80:{text:"showers", icon:"🌦"},
    95:{text:"thunderstorms", icon:"⛈"}
  };
  return map[code] || {text:"mixed chaos", icon:"🌥"};
}

function getResponseIcon(response, todayWeather, lastWeather, temperatureDelta){
  const language = response.toLowerCase();
  if (language.includes("rain") || language.includes("wet") || language.includes("storm")) return "🌧️";
  if (language.includes("snow") || language.includes("cold") || language.includes("freeze")) return "🥶";
  if (language.includes("heat") || language.includes("hot") || temperatureDelta > 5) return "🔥";
  if (language.includes("chaos") || language.includes("wild") || language.includes("dramatic")) return "🌪️";
  if (todayWeather.text.includes("clear") || todayWeather.text.includes("sun")) return "😎";
  if (lastWeather.text.includes("rain")) return "🤨";
  return temperatureDelta === 0 ? "🤷" : temperatureDelta > 0 ? "🌡️" : "🧥";
}

async function searchCity(){
  const q = document.getElementById("search").value;
  if(q.length < 3) return;

  const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${q}`);
  const data = await res.json();

  const results = document.getElementById("results");
  results.innerHTML = "";

  if(!data.results) return;

  data.results.slice(0,5).forEach(r=>{
    const div = document.createElement("div");

    const label = `${r.name}, ${r.admin1 || ""}, ${r.country}`;
    div.innerText = label;

    div.onclick = ()=>{
      selectedLocation = r;
      document.getElementById("search").value = label;
      results.innerHTML = "";
    };

    results.appendChild(div);
  });
}

async function render(){
  if(!selectedLocation){
    document.getElementById("summary").innerText = "Pick a real place first.";
    return;
  }

  const { latitude, longitude, name, admin1 } = selectedLocation;
  const locationLabel = admin1 ? `${name}, ${admin1}` : name;

  const today = new Date();
  const lastYear = new Date();
  lastYear.setFullYear(today.getFullYear()-1);

  const f = d=>d.toISOString().split("T")[0];

  const todayData = await (await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto`
  )).json();

  const lastData = await (await fetch(
    `https://archive-api.open-meteo.com/v1/archive?latitude=${latitude}&longitude=${longitude}&start_date=${f(lastYear)}&end_date=${f(lastYear)}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto`
  )).json();

  const th = cToF(todayData.daily.temperature_2m_max[0]);
  const tl = cToF(todayData.daily.temperature_2m_min[0]);
  const todayWeather = getWeather(todayData.daily.weathercode[0]);

  const lh = cToF(lastData.daily.temperature_2m_max[0]);
  const ll = cToF(lastData.daily.temperature_2m_min[0]);
  const lastWeather = getWeather(lastData.daily.weathercode[0]);

  document.getElementById("locationContext").innerText =
    `Weather comparison for ${locationLabel}`;

  document.getElementById("today").innerHTML =
    `<div class="weather-box">
      <strong>Today</strong>
      ${th}° / ${tl}°<br>
      <span class="icon">${todayWeather.icon}</span>${todayWeather.text}
    </div>`;

  document.getElementById("lastYear").innerHTML =
    `<div class="weather-box">
      <strong>Last Year</strong>
      ${lh}° / ${ll}°<br>
      <span class="icon">${lastWeather.icon}</span>${lastWeather.text}
    </div>`;

    const summary = document.getElementById("summary");
    summary.classList.remove("is-hidden");
    summary.classList.add("is-loading");
    summary.innerHTML = '<span class="ai-spinner" aria-label="AI is generating a response"></span>';

    try {
      const commentaryResponse = await fetch("/api/weather-comment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          todayWeather: todayWeather.text,
          lastWeather: lastWeather.text,
          todayTemp: th,
          lastTemp: lh,
          location: locationLabel
        })
      });

      const commentaryData = await commentaryResponse.json();
      if (!commentaryResponse.ok || !commentaryData.commentary) {
        throw new Error(commentaryData.error || "AI commentary unavailable");
      }

      summary.classList.remove("is-loading");
      const commentary = commentaryData.commentary;
      const temperatureDelta = th - lh;
      const icon = getResponseIcon(commentary, todayWeather, lastWeather, temperatureDelta);
      summary.innerHTML = `<span class="ai-icon" aria-hidden="true">${icon}</span><span>${commentary}</span>`;
    } catch (error) {
      summary.classList.remove("is-loading");
      summary.innerText = "The AI is unavailable right now. The weather remains suspicious.";
    }

}
</script>

</body>
</html>
